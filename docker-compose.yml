name: wms-landing

services:
  nextjs:
    image: furchtlos/wms-landing:latest
    container_name: wms-landing-nextjs
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000

  nginx:
    image: nginx:1.27-alpine
    container_name: wms-landing-nginx
    restart: unless-stopped
    ports:
      - "7000:7000"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - nextjs
